<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo/plp-pinwheel.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Playful Learning Partners is a boutique provider of guided playful learning pedagogy for school districts."
    />
    <title>Playful Learning Partners: Bringing Play into Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply theme before first paint to avoid a flash of wrong mode.
      // Precedence: ?theme=light|dark (demo/deep-link override, not
      // persisted) > saved preference > OS preference.
      ;(function () {
        var param = new URLSearchParams(window.location.search).get('theme')
        var saved = localStorage.getItem('plp-theme')
        var dark =
          param === 'dark' || param === 'light'
            ? param === 'dark'
            : saved
              ? saved === 'dark'
              : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
